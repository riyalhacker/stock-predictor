<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Stock Predictor Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* ... (I am keeping your existing styles, just ensure they are present) ... */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: #0f172a; color: white; padding: 20px; }
    .container { max-width: 1600px; margin: auto; }
    .card { background: #1e293b; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    input { background: #334155; border: 1px solid #475569; color: white; padding: 10px; border-radius: 5px; margin-right: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 AI Stock Predictor Pro</h1>
    <div class="grid">
      <div class="card">
        <h3>Live Market Stream</h3>
        <div id="market">Loading live prices...</div>
        <div id="chart"></div>
      </div>
      <div class="card">
        <h3>AI Prediction</h3>
        <input type="text" id="stockInput" placeholder="Enter Symbol (e.g. TCS)">
        <button class="btn" onclick="predict()">Get Prediction</button>
        <div id="predictionResult" style="margin-top:20px"></div>
      </div>
    </div>
  </div>

  <script>
    // --- UPDATED BACKEND URL ---
    const BACKEND_URL = "https://stock-predictor1-0jp0.onrender.com";
    const socket = io(BACKEND_URL);

    // --- LIVE MARKET UPDATE ---
    socket.on("market_update", (data) => {
      let html = "<ul>";
      for (let s in data) {
        html += `<li><b>${s}:</b> ₹${data[s]}</li>`;
      }
      html += "</ul>";
      document.getElementById("market").innerHTML = html;
    });

    // --- PREDICTION LOGIC ---
    async function predict() {
      let stock = document.getElementById("stockInput").value || "RELIANCE";
      let resDiv = document.getElementById("predictionResult");
      resDiv.innerHTML = "Processing AI Analysis...";

      try {
        let response = await fetch(`${BACKEND_URL}/predict?stock=${stock}`);
        let data = await response.json();

        if (data.error) {
          resDiv.innerHTML = `<p style="color:red">Error: ${data.error}</p>`;
        } else {
          resDiv.innerHTML = `
            <div style="background:#0ea5e9; padding:15px; border-radius:10px">
              <h4>${data.stock}</h4>
              <p>Current: ₹${data.current}</p>
              <p>Predicted: ₹${data.predicted}</p>
              <h2 style="color:${data.advice === 'BUY' ? '#4ade80' : '#f87171'}">ADVICE: ${data.advice}</h2>
            </div>
          `;
        }
      } catch (err) {
        resDiv.innerHTML = "Server connection failed.";
      }
    }

    // --- BACKTEST LOGIC ---
    async function backtest() {
        let stock = document.getElementById("stockInput").value || "RELIANCE";
        try {
            let response = await fetch(`${BACKEND_URL}/backtest?stock=${stock}`);
            let data = await response.json();
            console.log("Backtest results:", data);
        } catch (err) { console.error(err); }
    }

    // --- NEWS LOGIC ---
    async function loadNews() {
        try {
            let response = await fetch(`${BACKEND_URL}/news`);
            let data = await response.json();
            // render news logic here...
        } catch (err) { console.error(err); }
    }

    window.onload = loadNews;
  </script>
</body>
</html>
